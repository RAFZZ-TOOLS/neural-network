<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Neural Network AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:750px;
    background:#1e293b;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 30px rgba(0,0,0,0.4);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:120px;
    border:none;
    outline:none;
    resize:none;
    border-radius:12px;
    padding:15px;
    font-size:15px;
    background:#0f172a;
    color:white;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#3b82f6;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    background:#2563eb;
}

.output{
    margin-top:20px;
    background:#0f172a;
    border-radius:12px;
    padding:15px;
    min-height:100px;
    line-height:1.6;
}

.status{
    margin-top:10px;
    color:#94a3b8;
    font-size:14px;
}

</style>
</head>
<body>

<div class="container">

    <h1>Mini Neural Network AI</h1>

    <textarea
        id="inputText"
        placeholder="Tanyakan sesuatu..."
    ></textarea>

    <button onclick="predict()">
        Tanya AI
    </button>

    <div class="status" id="status">
        Memuat dataset...
    </div>

    <div class="output" id="output">
        Jawaban AI muncul di sini...
    </div>

</div>

<script>

let dataset = {};

// ============================
// LOAD DATASET
// ============================

async function loadDataset(){

    try{

        const response = await fetch("dataset.json");

        dataset = await response.json();

        const totalData =
            Object.keys(dataset).length;

        document.getElementById("status")
            .innerHTML =
            "Dataset dimuat : " + totalData + " data";

    }catch(err){

        document.getElementById("status")
            .innerHTML =
            "Gagal memuat dataset.json";

        console.error(err);

    }

}

loadDataset();

// ============================
// TOKENIZER
// ============================

function tokenize(text){

    return text
        .toLowerCase()
        .replace(/[^\w\s]/g,"")
        .split(" ");

}

// ============================
// SIMILARITY
// ============================

function similarity(inputWords, dataWords){

    let score = 0;

    for(let word of inputWords){

        if(dataWords.includes(word)){

            score++;

        }

    }

    return score;

}

// ============================
// PREDICT AI
// ============================

function predict(){

    const input = document
        .getElementById("inputText")
        .value
        .trim()
        .toLowerCase();

    if(!input){

        return;

    }

    const inputWords = tokenize(input);

    let bestScore = 0;

    let bestAnswer =
        "Saya belum tahu jawaban itu.";

    for(let question in dataset){

        const questionWords =
            tokenize(question);

        const score =
            similarity(
                inputWords,
                questionWords
            );

        if(score > bestScore){

            bestScore = score;

            bestAnswer = dataset[question];

        }

    }

    document.getElementById("output")
        .innerHTML =
        bestAnswer;

}

</script>

</body>
</html>
